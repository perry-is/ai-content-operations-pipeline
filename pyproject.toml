[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "content-operations-pipeline"
version = "0.1.0"
description = "Turns one long-form source into a validated publishing package with stable IDs and review flags"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
content-ops-demo = "content_operations.demo:main"

[tool.setuptools.packages.find]
where = ["src"]
